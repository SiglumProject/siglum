name: Build TeX Live WASM

on:
  workflow_dispatch:
    inputs:
      skip_wasm:
        description: 'Reuse cached BusyTeX binaries for this exact fork revision'
        type: boolean
        default: false
      create_release:
        description: 'Create a GitHub draft with the build inputs (main only)'
        type: boolean
        default: false
      release_tag:
        description: 'Tag for the optional draft'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    container:
      image: emscripten/emsdk@sha256:e856cd59d54fd143366c2df314043d63a1ca23ab43521e0f30f9d9a7ce6d43e0
      options: --user root
    env:
      EMSCRIPTEN_VERSION: '3.1.43'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            gperf p7zip-full icu-devtools file pkg-config libarchive-tools perl

      - name: Read BusyTeX revision
        id: busytex
        run: echo "revision=$(git -C busytex rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore exact BusyTeX binaries
        if: inputs.skip_wasm
        id: cached-busytex
        uses: actions/cache/restore@v4
        with:
          path: |
            busytex/build/native/busytex
            busytex/build/wasm/busytex.js
            busytex/build/wasm/busytex.wasm
            busytex/build/compiler.sha256
          key: busytex-${{ runner.os }}-${{ runner.arch }}-${{ steps.busytex.outputs.revision }}-${{ hashFiles('.github/workflows/build.yml') }}
          fail-on-cache-miss: true

      - name: Build native tools
        if: ${{ !inputs.skip_wasm }}
        working-directory: busytex
        run: make native

      - name: Build the combined WASM
        if: ${{ !inputs.skip_wasm }}
        working-directory: busytex
        run: |
          # The WASM rules use the native ICU, FreeType and Web2C tools.
          make wasm
          sha256sum build/native/busytex build/wasm/busytex.{js,wasm} > build/compiler.sha256

      - name: Cache the compiler before installing packages
        if: ${{ !inputs.skip_wasm }}
        uses: actions/cache/save@v4
        with:
          path: |
            busytex/build/native/busytex
            busytex/build/wasm/busytex.js
            busytex/build/wasm/busytex.wasm
            busytex/build/compiler.sha256
          key: busytex-${{ runner.os }}-${{ runner.arch }}-${{ steps.busytex.outputs.revision }}-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Install the pinned base and generate the June formats
        working-directory: busytex
        run: |
          sha256sum --check build/compiler.sha256
          make build/texlive-basic.txt
          bash regen-formats.sh
          make build/wasm/texlive-basic.js

      - name: Verify the standalone BusyTeX release archive
        working-directory: busytex
        run: |
          make build/versions.txt
          bash package-wasm-release.sh "$(git rev-parse HEAD)"

      - name: Split into bundles
        working-directory: packages
        run: |
          # Seed the external font bundle so the splitter preserves it in the registry.
          cm_super=../busytex/source/texmfrepo/archive/cm-super.r15878.tar.xz
          bun run bundle-cm-super.ts --texlive-archive "$cm_super"
          bun run split-bundle.ts \
            ../busytex/build/wasm/texlive-basic.js \
            ../busytex/build/wasm/texlive-basic.data \
            ./bundles

      - name: Verify formats and make the bundle archive
        run: |
          (cd busytex && sha256sum --check build/texlive-basic-formats.sha256)
          python3 - <<'PY'
          from gzip import decompress
          from pathlib import Path
          import json

          bundles = Path("packages/bundles")
          manifest = json.loads((bundles / "file-manifest.json").read_text())
          registry = json.loads((bundles / "bundles.json").read_text())
          cm_font = "/texlive/texmf-dist/fonts/type1/public/cm-super/sfrm1000.pfb"
          if "cm-super" not in registry["bundles"] or manifest.get(cm_font, {}).get("bundle") != "cm-super":
              raise SystemExit("Missing cm-super font bundle or index entry")
          for command, packages in registry.get("sourceCommands", {}).items():
              for package in packages:
                  if registry["packages"].get(package) not in registry["bundles"]:
                      raise SystemExit(f"Source command {command} has no bundle for {package}")
          for engine, name in (("pdftex", "pdflatex"), ("xetex", "xelatex"), ("luahbtex", "luahblatex")):
              file = f"texmf-dist/texmf-var/web2c/{engine}/{name}.fmt"
              entry = manifest[f"/texlive/{file}"]
              bundle = "fmt-lualatex" if engine == "luahbtex" else f"fmt-{name}"
              if entry["bundle"] != bundle:
                  raise SystemExit(f"Unexpected bundle for {file}")
              data = decompress((bundles / f"{bundle}.data.gz").read_bytes())
              start, end = entry["start"], entry["end"]
              expected = (Path("busytex/build/texlive-basic") / file).read_bytes()
              if not (0 <= start < end <= len(data)) or data[start:end] != expected:
                  raise SystemExit(f"Bundled format does not match generated bytes: {file}")
          PY
          tar -czf siglum-bundles.tar.gz -C packages bundles/

      - name: Upload runtime build inputs
        uses: actions/upload-artifact@v4
        with:
          name: runtime-build-inputs
          path: |
            busytex/build/wasm/busytex.js
            busytex/build/wasm/busytex.wasm
            busytex/build/texlive-basic-formats.sha256
            busytex/build/texlive-basic/texmf-dist/tex/latex/base/docstrip.tex
            busytex/build/texlive-basic/texmf-dist/web2c/texmf.cnf
            siglum-bundles.tar.gz
          if-no-files-found: error
          retention-days: 30

  draft-release:
    needs: build-runtime
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.create_release && inputs.release_tag != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: runtime-build-inputs

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          files: |
            busytex/build/wasm/busytex.js
            busytex/build/wasm/busytex.wasm
            busytex/build/texlive-basic-formats.sha256
            busytex/build/texlive-basic/texmf-dist/tex/latex/base/docstrip.tex
            busytex/build/texlive-basic/texmf-dist/web2c/texmf.cnf
            siglum-bundles.tar.gz
          fail_on_unmatched_files: true
          draft: true
