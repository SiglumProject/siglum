name: Test
on:
  push:
    branches: [main, upgrade/texlive-2026]
  pull_request:
jobs:
  vitest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
        with:
          path: engine
      - uses: actions/checkout@v4
        with:
          repository: SiglumProject/siglum-filesystem
          path: siglum-filesystem
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - name: Build filesystem dependency
        working-directory: siglum-filesystem
        run: bun install --frozen-lockfile && bun run build
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests and declaration checks
        run: bun run test:run && bun run test:types
