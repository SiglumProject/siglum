name: Test
on:
  push:
    branches: [main, upgrade/texlive-2026]
  pull_request:
permissions:
  contents: read
jobs:
  vitest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
        with:
          path: engine
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests and declaration checks
        run: bun run test:run && bun run test:types
      - name: Install Chromium for the storage regression
        run: bunx playwright install --with-deps chromium
      - name: Verify offline manifest storage in Chromium
        run: bun run test:browser:run tests/browser/storage.test.ts
      - name: Verify the npm tarball
        run: |
          staging=$(mktemp -d)
          cp -R package.json README.md LICENSE src types "$staging/"
          cd "$staging"
          npm pkg delete overrides
          npm pack --json > packed.json
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';

          const [pack] = JSON.parse(readFileSync('packed.json', 'utf8'));
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          const paths = new Set(pack.files.map(file => file.path));
          assert.equal(pack.version, manifest.version);
          assert(paths.has('src/index.js'));
          assert(paths.has('types/index.d.ts'));
          assert(![...paths].some(path => /\.(wasm|fmt)$/.test(path)));
          JS
